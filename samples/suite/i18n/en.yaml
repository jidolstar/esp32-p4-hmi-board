  interfaces.topic.rs485.title: "RS485 Communication"
  interfaces.topic.rs485.summary: "Provides frame I/O contracts; a later adapter owns the device protocol."
  interfaces.topic.rs485.purpose: "Use it for half-duplex serial links over long cables or shared device buses."
  interfaces.topic.rs485.provided: "Rs485Port provides baud and parity configuration, bounded read/write, cancel, and explicit results."
  interfaces.topic.rs485.connect: "Keep the board UART and direction pin inside a platform/hmi adapter and inject only the port."
  interfaces.topic.rs485.steps: "Create the adapter, apply Rs485Config, then exchange frames from a product codec or worker."
  interfaces.topic.rs485.limits: "Buffers are borrowed only for each call. The adapter must outlive every consumer of its port."
  interfaces.topic.rs485.excluded: "UART numbers, pin maps, Modbus or other device protocols, and a live worker are not implemented."
  interfaces.topic.gpio.title: "Digital GPIO"
  interfaces.topic.gpio.summary: "Provides logical input/output lines while keeping product pin meaning separate."
  interfaces.topic.gpio.purpose: "Use it for switches and simple on/off outputs without coupling product logic to physical pins."
  interfaces.topic.gpio.provided: "GpioPort provides mode, pull, initial level, read, write, and explicit operation results."
  interfaces.topic.gpio.connect: "A Board-owned adapter maps logical lines to GPIO or an I/O expander without exposing handles."
  interfaces.topic.gpio.steps: "Define the product pin map, register adapter lines, configure each line, then read or write it."
  interfaces.topic.gpio.limits: "Lines are 16-bit IDs. Interrupts, debounce, and product safety policy belong in another controller."
  interfaces.topic.gpio.excluded: "This page assigns no board pins, changes no outputs, and does not compose a live GPIO adapter."
  interfaces.topic.pwm.title: "PWM Output"
  interfaces.topic.pwm.summary: "Provides frequency, resolution, and duty contracts without choosing an output device."
  interfaces.topic.pwm.purpose: "Use it for duty-controlled outputs such as brightness, fans, or actuators."
  interfaces.topic.pwm.provided: "PwmPort provides channel attach, duty update, stop, detach, and explicit results."
  interfaces.topic.pwm.connect: "The platform adapter validates timer and physical pin allocation and exposes bounded channels."
  interfaces.topic.pwm.steps: "Register adapter channels, apply PwmConfig, set duty, then stop and detach when finished."
  interfaces.topic.pwm.limits: "The adapter validates duty against resolution; ramps and interlocks remain product policy."
  interfaces.topic.pwm.excluded: "Pins, frequencies, and safety limits for motors, heaters, or other real loads are not defined."
  interfaces.topic.usb_command.title: "USB CDC Commands"
  interfaces.topic.usb_command.summary: "Defines a bounded frame boundary between one USB reader and a command dispatcher."
  interfaces.topic.usb_command.purpose: "Use it for small diagnostic or configuration commands exchanged with a PC tool."
  interfaces.topic.usb_command.provided: "UsbCommandPort provides receive/send up to 512 bytes, cancel, and explicit results."
  interfaces.topic.usb_command.connect: "Keep one TinyUSB reader and pass complete frames to a product command dispatcher."
  interfaces.topic.usb_command.steps: "Start the USB adapter, receive a bounded frame, validate the protocol, then dispatch it."
  interfaces.topic.usb_command.limits: "The port retains no frame. Bound framing, timeouts, and authorization before dispatch."
  interfaces.topic.usb_command.excluded: "Command definitions, authentication, a serial protocol, and a live USB endpoint are not implemented."
  interfaces.topic.storage_files.title: "Storage File Access"
  interfaces.topic.storage_files.summary: "The public storage contract and exclusive lease flow already used by S05."
  interfaces.topic.storage_files.purpose: "Use it to track media generations and PC ownership while the HMI reads or writes SD files."
  interfaces.topic.storage_files.provided: "The storage controller and Board Storage facade provide state, capacity, and exclusive access."
  interfaces.topic.storage_files.connect: "Feature modules use public file and lease APIs and never include boards/jc1060p470c/internal."
  interfaces.topic.storage_files.steps: "Check media, acquire an HMI lease, stream bounded chunks, then release handles and the lease."
  interfaces.topic.storage_files.limits: "Discard handles after a generation change; never load a whole file onto a task stack or RAM buffer."
  interfaces.topic.storage_files.excluded: "S09 does not duplicate storage, add a file browser, or define a product directory policy."
  interfaces.topic.usb_msc.title: "USB Mass Storage"
  interfaces.topic.usb_msc.summary: "S05 prevents the HMI and PC from owning the SD card at the same time."
  interfaces.topic.usb_msc.purpose: "Use it to expose SD as a removable PC drive without corrupting the HMI filesystem."
  interfaces.topic.usb_msc.provided: "SD quiesce, unmount, MSC exposure, eject/unplug detection, and remount recovery are implemented."
  interfaces.topic.usb_msc.connect: "The S05 page and storage controller coordinate the global lock and explicit return to HMI."
  interfaces.topic.usb_msc.steps: "Drain file work, unmount SD, expose it to PC, detect eject/unplug, then remount and advance generation."
  interfaces.topic.usb_msc.limits: "HMI file I/O is forbidden during PC ownership; lock remains on callback-drain or remount failure."
  interfaces.topic.usb_msc.excluded: "S09 adds no MSC action or USB driver. Run and verify the implemented flow on S05."
  interfaces.topic.usb_assets.title: "USB Asset Update"
  interfaces.topic.usb_assets.summary: "A Board-internal updater validates and replaces profile asset bundles in a restricted root."
  interfaces.topic.usb_assets.purpose: "Use it to replace fonts, sounds, and image bundles without changing firmware."
  interfaces.topic.usb_assets.provided: "asset_usb_updater validates profile root, manifest, size, and hash before generation replacement."
  interfaces.topic.usb_assets.connect: "Board startup owns the updater; UI displays its result overlay and never calls internals directly."
  interfaces.topic.usb_assets.steps: "Prepare a bundle, connect USB, validate manifest and hashes, stage it, then switch generation."
