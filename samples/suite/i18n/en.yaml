  interfaces.topic.rs485.title: "RS485 Communication"
  interfaces.topic.rs485.summary: "Defines how a product exchanges data with devices on a shared serial bus."
  interfaces.topic.rs485.purpose: "RS485 connects equipment such as meters and controllers over a differential serial line. On a half-duplex bus, devices take turns transmitting and receiving."
  interfaces.topic.rs485.provided: "Rs485Port defines configuration for baud rate and parity, reads and writes into caller-provided buffers, and cancellation. Results report the transfer outcome and byte count."
  interfaces.topic.rs485.connect: "The HMI adapter owns the UART and transmit direction control. The product controller uses the port and handles framing, device addresses, and response parsing."
  interfaces.topic.rs485.steps: "Confirm the board connector and peer settings. Configure the adapter, send a request, read the response within a timeout, and validate it against the device protocol."
  interfaces.topic.rs485.limits: "Keep buffers valid for the duration of each call. The adapter must outlive its consumers. Handle timeouts and partial transfers before reusing a request or response."
  interfaces.topic.rs485.excluded: "To communicate with a real device, supply the board pin mapping, a UART adapter, and a device protocol such as Modbus RTU."
  interfaces.topic.gpio.title: "Digital GPIO"
  interfaces.topic.gpio.summary: "Defines digital input and output operations using logical line IDs."
  interfaces.topic.gpio.purpose: "Use digital GPIO to read a switch or sensor state, or to turn a simple output such as an indicator on and off. The application refers to a logical line instead of a physical pin number."
  interfaces.topic.gpio.provided: "GpioPort defines the input or output mode, pull configuration, initial output level, and read and write operations. Each operation returns a result."
  interfaces.topic.gpio.connect: "A board adapter maps each logical line to a physical GPIO or an I/O expander. Product code uses the logical IDs assigned in its pin map."
  interfaces.topic.gpio.steps: "Check the circuit and assign each line a role. Configure inputs with the required pull and outputs with a safe initial level before reading or writing them."
  interfaces.topic.gpio.limits: "Match the active level to the circuit. Handle switch debounce, interrupts, and safe output transitions in the product controller as needed."
  interfaces.topic.gpio.excluded: "Using a real signal requires a board-specific pin map and a GPIO adapter. This page provides reference information for that integration."
  interfaces.topic.pwm.title: "PWM Output"
  interfaces.topic.pwm.summary: "Defines how to configure PWM channels and change their duty cycle."
  interfaces.topic.pwm.purpose: "PWM switches a signal at a fixed frequency and varies the portion of each cycle spent on. It can control compatible loads such as a dimmable LED or a fan with a PWM input."
  interfaces.topic.pwm.provided: "PwmPort defines channel attachment with a frequency and resolution, duty updates, stopping, and detaching. Each operation reports its result."
  interfaces.topic.pwm.connect: "The board adapter maps logical channels to pins and timers. It validates allocation and translates duty values for the hardware."
  interfaces.topic.pwm.steps: "Check the load specification and available timers. Attach a channel with the selected frequency and resolution, set duty within that range, then stop and detach it when finished."
  interfaces.topic.pwm.limits: "Select a frequency and safe stopped state for the connected circuit. Product control is responsible for ramping and interlocks where the load requires them."
  interfaces.topic.pwm.excluded: "Driving a real output requires a compatible circuit, board pin and timer allocation, and a PWM adapter. Product limits depend on the connected load."
  interfaces.topic.usb_command.title: "USB CDC Commands"
  interfaces.topic.usb_command.summary: "Defines how a PC tool and the HMI exchange small command messages."
  interfaces.topic.usb_command.purpose: "Use USB CDC to exchange diagnostic or configuration messages with a PC over a serial-style USB connection. Each product defines the messages it accepts."
  interfaces.topic.usb_command.provided: "UsbCommandPort defines receiving, sending, and cancelling command frames. A frame may contain up to 512 bytes."
  interfaces.topic.usb_command.connect: "A single USB reader owns the incoming byte stream. The adapter assembles complete frames and passes them to a product command handler."
  interfaces.topic.usb_command.steps: "Define how the PC and device delimit messages. Assemble a complete frame, validate its length and contents, dispatch the command, then send a response."
  interfaces.topic.usb_command.limits: "Handle incomplete or oversized input before dispatching. Frame storage belongs to the caller, and the product defines timeouts, permissions, and error responses."
  interfaces.topic.usb_command.excluded: "Using custom commands requires a USB adapter, message format, and handlers. The separate USB asset updater already has its own protocol."
  interfaces.topic.storage_files.title: "SD File Access"
  interfaces.topic.storage_files.summary: "Lets the HMI read and write SD card files while it owns the card."
  interfaces.topic.storage_files.purpose: "Use HMI file access to read fonts and sounds or save product data on the SD card. The SD Storage screen shows whether the card is mounted and which side owns it."
  interfaces.topic.storage_files.provided: "The board's public Storage API provides file operations and media status. File access is coordinated with the switch to PC ownership."
  interfaces.topic.storage_files.connect: "Product services use the public file API. An operation that keeps a stream open across multiple calls holds a storage lease until the stream is closed."
  interfaces.topic.storage_files.steps: "Confirm the SD card is mounted and owned by the HMI. Acquire a lease for long streaming work, transfer manageable blocks, close the file, and release the lease."
  interfaces.topic.storage_files.limits: "After removal or remounting, reopen files using the current mount generation. Keep large file contents out of task stacks and check I/O results before continuing."
  interfaces.topic.storage_files.excluded: "Define the product folders, file formats, and behavior when the SD card is missing or full. See SD Storage for ownership and capacity."
  interfaces.topic.usb_msc.title: "USB Mass Storage"
  interfaces.topic.usb_msc.summary: "Temporarily presents the HMI's SD card to a PC as a removable drive."
  interfaces.topic.usb_msc.purpose: "Use USB Mass Storage when you need to manage SD card files on a PC. Only one side owns the card at a time to protect the filesystem."
  interfaces.topic.usb_msc.provided: "When no file operation is active, the HMI unmounts the SD card before exposing it over USB. It remounts the card after the PC releases it or the connection ends."
  interfaces.topic.usb_msc.connect: "Open SD Storage from the dashboard. Its connection control hands the card to the PC and shows a lock screen while the PC owns it."
  interfaces.topic.usb_msc.steps: "Connect a USB data cable, then select Connect to PC in SD Storage. Finish file operations on the PC and safely eject the drive. Wait until the HMI shows the card is mounted again."
  interfaces.topic.usb_msc.limits: "During PC ownership the HMI and USB asset updater cannot access SD files. If remounting fails, the lock stays active until the device can recover."
  interfaces.topic.usb_msc.excluded: "Use a compatible FAT32 card. Check the HMI ownership status after disconnecting before starting a file operation or a USB asset update."
  interfaces.topic.usb_assets.title: "USB Asset Update"
  interfaces.topic.usb_assets.summary: "Updates the active profile's SD card assets over USB."
  interfaces.topic.usb_assets.purpose: "Use this tool to replace packaged assets such as fonts and sounds on the HMI. The running firmware can use the new assets after the relevant screen is reopened."
  interfaces.topic.usb_assets.provided: "The updater checks the profile, file list, sizes, and SHA-256 hashes. It stages the complete bundle before switching to it."
  interfaces.topic.usb_assets.connect: "The HMI receives the bundle over USB CDC. The PC-side sample asset tool prepares and transfers it, and the HMI displays preparation and transfer progress."
  interfaces.topic.usb_assets.steps: "Connect the HMI over USB and confirm it owns the SD card. Identify the COM port, then run samples_update_hmi_assets.bat with that port. Wait for the completion message before disconnecting."
  interfaces.topic.usb_assets.limits: "Close any serial monitor using that port. The updater rejects files outside the allowed profile path and pauses access when the PC owns the SD card as a removable drive."
  interfaces.topic.usb_assets.excluded: "To copy unrelated files, use SD Storage. Changes to application code require a separate firmware build and installation."
  interfaces.topic.firmware_update.title: "Firmware Update Foundation"
  interfaces.topic.firmware_update.summary: "Provides verification and recovery components for a product firmware updater."
  interfaces.topic.firmware_update.purpose: "Use these components when a product needs to install a firmware image and recover if the new version fails to start correctly. Product integration determines when and where updates are offered."
  interfaces.topic.firmware_update.provided: "The update module validates signed manifests and checks artifact hashes. It also supports staged downloads, a persistent installation record, and boot acceptance or rollback decisions."
  interfaces.topic.firmware_update.connect: "The product supplies the network source, signature verification, staging storage, firmware writer, and boot controls through the update interfaces."
  interfaces.topic.firmware_update.steps: "Verify the manifest and target, download and check the artifact, record the pending installation, and let the device start the new firmware. Confirm health before accepting it, or apply the recovery decision."
  interfaces.topic.firmware_update.limits: "Manifests are limited to 64 KiB and transfers use blocks of up to 4 KiB. A download or write alone does not mark an update as successful."
  interfaces.topic.firmware_update.excluded: "To deliver an update, a product must connect its server, signing and verification setup, and board installation and recovery code. The sample exposes this reference information."
