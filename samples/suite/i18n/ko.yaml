  interfaces.topic.rs485.title: "RS485 통신"
  interfaces.topic.rs485.summary: "공유 직렬 버스에서 장치와 데이터를 주고받는 공통 인터페이스입니다."
  interfaces.topic.rs485.purpose: "RS485는 계측기나 제어기를 차동 직렬 신호로 연결할 때 사용합니다. 반이중 버스에서는 한 번에 한 장치가 송신하고 나머지는 수신합니다."
  interfaces.topic.rs485.provided: "Rs485Port는 전송 속도와 패리티 설정, 호출자가 제공한 버퍼를 이용한 읽기와 쓰기, 작업 취소를 정의합니다. 결과에는 전송 상태와 처리한 바이트 수가 포함됩니다."
  interfaces.topic.rs485.connect: "HMI 어댑터가 UART와 송수신 방향 제어를 맡습니다. 제품 제어기는 포트를 사용하며 메시지 형식, 장치 주소, 응답 해석을 담당합니다."
  interfaces.topic.rs485.steps: "보드 커넥터와 상대 장치의 통신 설정을 확인합니다. 어댑터를 설정한 뒤 요청을 보내고, 제한 시간 안에 수신한 응답을 장치 규약에 따라 검증합니다."
  interfaces.topic.rs485.limits: "전송 버퍼는 호출이 끝날 때까지 유지합니다. 어댑터는 포트를 사용하는 제어기보다 오래 유지하고, 시간 초과와 일부 전송을 구분해 처리합니다."
  interfaces.topic.rs485.excluded: "실제 장치와 통신하려면 보드 핀 배치, UART 어댑터, Modbus RTU 같은 장치 통신 규약을 제품에 연결해야 합니다."
  interfaces.topic.gpio.title: "디지털 GPIO"
  interfaces.topic.gpio.summary: "논리 채널 번호로 디지털 입력을 읽고 출력을 제어하는 공통 인터페이스입니다."
  interfaces.topic.gpio.purpose: "스위치나 센서의 상태를 읽고 표시등처럼 켜짐과 꺼짐으로 동작하는 출력을 제어할 때 사용합니다. 앱은 물리 핀 번호 대신 논리 채널로 각 신호를 구분합니다."
  interfaces.topic.gpio.provided: "GpioPort는 입력·출력 모드, 풀업·풀다운, 초기 출력 레벨, 읽기와 쓰기를 정의합니다. 각 작업은 처리 결과를 반환합니다."
  interfaces.topic.gpio.connect: "보드 어댑터가 논리 채널을 실제 GPIO 또는 입출력 확장기에 매핑합니다. 제품 코드는 제품 핀 배치에 정의한 논리 채널 번호를 사용합니다."
  interfaces.topic.gpio.steps: "회로를 확인한 뒤 각 채널의 역할을 정합니다. 입력에는 필요한 풀업·풀다운을 설정하고, 출력에는 안전한 초기 레벨을 지정한 뒤 읽거나 씁니다."
  interfaces.topic.gpio.limits: "회로에 맞는 활성 레벨을 사용합니다. 스위치 접점 떨림, 인터럽트, 안전한 출력 전환은 필요한 경우 제품 제어기에서 처리합니다."
  interfaces.topic.gpio.excluded: "실제 신호를 사용하려면 보드별 핀 배치와 GPIO 어댑터가 필요합니다. 이 화면은 해당 연동에 필요한 정보를 제공합니다."
  interfaces.topic.pwm.title: "PWM 출력"
  interfaces.topic.pwm.summary: "PWM 채널을 설정하고 한 주기에서 출력이 켜져 있는 비율을 조절합니다."
  interfaces.topic.pwm.purpose: "PWM은 일정한 주파수로 신호를 전환하면서 한 주기 중 켜져 있는 비율을 바꿉니다. 밝기를 조절하는 LED나 PWM 입력을 받는 팬처럼 호환되는 장치에 사용할 수 있습니다."
  interfaces.topic.pwm.provided: "PwmPort는 주파수와 해상도를 지정한 채널 연결, 듀티 변경, 정지와 연결 해제를 정의합니다. 각 작업은 처리 결과를 반환합니다."
  interfaces.topic.pwm.connect: "보드 어댑터가 논리 채널을 실제 핀과 타이머에 연결합니다. 사용할 수 있는 자원인지 확인하고 듀티 값을 하드웨어 설정으로 변환합니다."
  interfaces.topic.pwm.steps: "부하의 사양과 사용 가능한 타이머를 확인합니다. 주파수와 해상도를 정해 채널을 연결하고 범위 안에서 듀티를 설정한 뒤, 사용을 마치면 정지하고 해제합니다."
  interfaces.topic.pwm.limits: "연결한 회로에 맞는 주파수와 안전한 정지 상태를 정합니다. 출력의 점진적 변경이나 동작 제한이 필요한 부하는 제품 제어기가 관리합니다."
  interfaces.topic.pwm.excluded: "실제 출력에는 호환 회로, 보드 핀과 타이머 배정, PWM 어댑터가 필요합니다. 허용 범위는 연결한 부하의 사양에 따릅니다."
  interfaces.topic.usb_command.title: "USB CDC 명령"
  interfaces.topic.usb_command.summary: "PC 도구와 HMI가 짧은 명령 메시지를 주고받는 공통 인터페이스입니다."
  interfaces.topic.usb_command.purpose: "USB CDC는 PC에서 직렬 포트처럼 연결해 진단이나 설정 메시지를 주고받는 데 사용합니다. 어떤 메시지를 받아들일지는 제품이 정합니다."
  interfaces.topic.usb_command.provided: "UsbCommandPort는 명령 프레임의 수신, 송신과 작업 취소를 정의합니다. 프레임 하나의 최대 크기는 512바이트입니다."
  interfaces.topic.usb_command.connect: "하나의 USB 수신기가 들어오는 바이트 스트림을 관리합니다. 어댑터는 바이트를 완전한 프레임으로 묶어 제품의 명령 처리기에 전달합니다."
  interfaces.topic.usb_command.steps: "PC와 장치가 메시지 경계를 구분할 규칙을 정합니다. 프레임을 완성한 뒤 길이와 내용을 확인하고, 해당 명령을 처리한 결과를 응답으로 보냅니다."
  interfaces.topic.usb_command.limits: "불완전하거나 너무 큰 입력은 명령 처리 전에 걸러냅니다. 프레임 저장 공간은 호출자가 관리하고, 제한 시간과 권한 검사 및 오류 응답은 제품이 정합니다."
  interfaces.topic.usb_command.excluded: "사용자 정의 명령에는 USB 어댑터, 메시지 형식, 명령 처리기가 필요합니다. USB 자산 업데이트는 별도의 전송 규약으로 동작합니다."
  interfaces.topic.storage_files.title: "SD 파일 접근"
  interfaces.topic.storage_files.summary: "HMI가 SD 카드를 사용 중일 때 카드의 파일을 읽고 씁니다."
  interfaces.topic.storage_files.purpose: "SD 카드의 글꼴과 음원을 읽거나 제품 데이터를 저장할 때 사용합니다. 대시보드의 SD 저장소 화면에서 카드가 마운트됐는지와 현재 사용 주체를 확인할 수 있습니다."
  interfaces.topic.storage_files.provided: "보드의 공개 Storage API는 파일 작업과 저장 매체의 상태 조회를 제공합니다. 파일에 접근하는 동안에는 PC가 SD 카드를 가져가는 시점이 조정됩니다."
  interfaces.topic.storage_files.connect: "제품 서비스는 공개 파일 API를 사용합니다. 여러 호출에 걸쳐 파일을 열어 두는 작업은 스트림을 닫을 때까지 저장소 사용권을 유지합니다."
  interfaces.topic.storage_files.steps: "SD 카드가 마운트됐고 HMI가 사용 중인지 확인합니다. 장시간 작업은 사용권을 확보한 뒤 파일을 작은 블록 단위로 처리하고, 파일을 닫은 다음 사용권을 해제합니다."
  interfaces.topic.storage_files.limits: "카드를 뺐다가 다시 장착하거나 마운트가 바뀌면 현재 마운트 상태를 확인하고 파일을 다시 엽니다. 큰 파일을 한꺼번에 읽지 않고 각 입출력 결과를 확인합니다."
  interfaces.topic.storage_files.excluded: "제품별 폴더와 파일 형식, 카드가 없거나 가득 찼을 때의 동작을 정해야 합니다. 사용 주체와 용량은 SD 저장소 화면에서 확인할 수 있습니다."
  interfaces.topic.usb_msc.title: "USB 대용량 저장소"
  interfaces.topic.usb_msc.summary: "HMI의 SD 카드를 PC에서 이동식 드라이브로 열 수 있도록 전환합니다."
  interfaces.topic.usb_msc.purpose: "PC에서 SD 카드의 파일을 복사하거나 정리할 때 USB 대용량 저장소를 사용합니다. 파일 시스템을 보호하기 위해 한 번에 한쪽만 카드를 사용합니다."
  interfaces.topic.usb_msc.provided: "진행 중인 파일 작업이 없으면 HMI가 SD 카드의 마운트를 해제한 뒤 USB로 카드를 제공합니다. PC가 카드를 반환하거나 연결이 끝나면 HMI가 다시 마운트합니다."
  interfaces.topic.usb_msc.connect: "대시보드에서 SD 저장소를 엽니다. 이 화면의 연결 기능으로 카드 사용권을 PC에 넘기면 PC가 사용하는 동안 잠금 화면이 표시됩니다."
  interfaces.topic.usb_msc.steps: "USB 데이터 케이블을 연결하고 SD 저장소에서 PC에 연결을 누릅니다. PC에서 파일 작업을 끝낸 뒤 드라이브를 안전 제거하고 HMI에 다시 마운트될 때까지 기다립니다."
  interfaces.topic.usb_msc.limits: "PC가 카드를 사용하는 동안 HMI와 USB 자산 업데이트 기능은 SD 파일에 접근할 수 없습니다. 재마운트에 실패하면 복구될 때까지 잠금 상태가 유지됩니다."
  interfaces.topic.usb_msc.excluded: "호환되는 FAT32 카드를 사용합니다. 연결을 끝낸 뒤에는 HMI가 카드를 다시 사용 중인지 확인하고 파일 작업이나 USB 자산 업데이트를 시작합니다."
  interfaces.topic.usb_assets.title: "USB 자산 업데이트"
  interfaces.topic.usb_assets.summary: "USB를 통해 현재 프로필이 사용하는 SD 카드 자산을 갱신합니다."
  interfaces.topic.usb_assets.purpose: "HMI의 글꼴이나 음원처럼 묶음으로 배포하는 파일을 교체할 때 사용합니다. 갱신을 마친 뒤 해당 화면을 다시 열면 새 자산을 불러옵니다."
  interfaces.topic.usb_assets.provided: "업데이트 기능은 프로필과 파일 목록, 크기, SHA-256 해시를 검사합니다. 묶음 전체를 임시 위치에 저장하고 검증한 뒤 기존 묶음과 교체합니다."
  interfaces.topic.usb_assets.connect: "HMI는 USB CDC로 묶음을 받습니다. PC의 샘플 자산 도구가 묶음을 준비하고 전송하며 HMI 화면에 준비와 전송 진행률이 표시됩니다."
  interfaces.topic.usb_assets.steps: "HMI를 USB로 연결하고 SD 카드를 HMI가 사용 중인지 확인합니다. COM 포트를 확인한 뒤 samples_update_hmi_assets.bat에 해당 포트를 지정해 실행하고, 완료 메시지가 표시될 때까지 기다립니다."
  interfaces.topic.usb_assets.limits: "같은 포트를 열어 둔 시리얼 모니터를 닫습니다. 허용된 프로필 경로 밖의 파일은 거부되며 PC가 SD 카드를 이동식 드라이브로 사용 중이면 전송할 수 없습니다."
  interfaces.topic.usb_assets.excluded: "일반 파일 복사에는 SD 저장소를 사용합니다. 앱 코드 변경을 적용하려면 별도로 펌웨어를 빌드해 설치해야 합니다."
  interfaces.topic.firmware_update.title: "펌웨어 업데이트 기반"
  interfaces.topic.firmware_update.summary: "제품의 펌웨어 업데이트에 필요한 검증과 복구 구성 요소를 제공합니다."
  interfaces.topic.firmware_update.purpose: "제품에 새 펌웨어를 설치하고 새 버전이 정상적으로 시작하지 못했을 때 복구하는 데 사용합니다. 업데이트를 언제 어디서 제공할지는 제품이 결정합니다."
  interfaces.topic.firmware_update.provided: "업데이트 모듈은 서명된 매니페스트를 검증하고 파일 해시를 확인합니다. 임시 저장을 거치는 다운로드, 설치 상태 기록, 부팅 후 확정 또는 되돌리기 판단도 지원합니다."
  interfaces.topic.firmware_update.connect: "제품은 업데이트 인터페이스를 통해 다운로드 서버, 서명 검증, 임시 저장소, 펌웨어 기록과 부팅 제어 기능을 연결합니다."
  interfaces.topic.firmware_update.steps: "매니페스트와 대상 장치를 검증하고 파일을 내려받아 검사합니다. 설치 대기 상태를 기록하고 새 펌웨어로 부팅한 뒤 정상 동작을 확인해 설치를 확정하거나 복구합니다."
  interfaces.topic.firmware_update.limits: "매니페스트는 최대 64 KiB이며 전송 블록은 최대 4 KiB입니다. 다운로드나 기록이 끝난 뒤에도 새 펌웨어의 정상 동작을 확인해야 업데이트가 성공으로 기록됩니다."
  interfaces.topic.firmware_update.excluded: "실제 업데이트를 배포하려면 제품 서버, 서명 및 검증 설정, 보드의 설치·복구 구현을 연결해야 합니다. 샘플에서는 관련 기능의 설명을 확인할 수 있습니다."
