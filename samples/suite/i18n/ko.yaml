  interfaces.topic.rs485.title: "RS485 통신"
  interfaces.topic.rs485.summary: "frame 입출력 계약만 제공하며 장치 protocol은 후속 adapter가 구현합니다."
  interfaces.topic.rs485.purpose: "긴 배선이나 여러 장치를 반이중 serial bus로 연결할 때 사용합니다."
  interfaces.topic.rs485.provided: "Rs485Port가 baud·parity 설정, bounded read/write와 cancel 결과를 제공합니다."
  interfaces.topic.rs485.connect: "보드 UART와 direction pin은 platform/hmi adapter 안에 숨기고 port만 controller에 주입합니다."
  interfaces.topic.rs485.steps: "adapter 생성 → Rs485Config 적용 → 제품 codec/worker에서 frame 교환 순서로 조립합니다."
  interfaces.topic.rs485.limits: "buffer는 호출 동안만 유효하며 port가 저장하지 않습니다. adapter 수명은 caller보다 길어야 합니다."
  interfaces.topic.rs485.excluded: "UART 번호, pin map, Modbus 같은 장치 protocol과 실제 송수신 worker는 구현하지 않았습니다."
  interfaces.topic.gpio.title: "디지털 GPIO"
  interfaces.topic.gpio.summary: "논리 line의 입력·출력 계약을 제공하며 제품 pin 의미는 분리합니다."
  interfaces.topic.gpio.purpose: "스위치 입력이나 단순 on/off 출력을 제품 로직과 분리해 다룰 때 사용합니다."
  interfaces.topic.gpio.provided: "GpioPort가 mode, pull, initial level 설정과 read/write 결과를 제공합니다."
  interfaces.topic.gpio.connect: "실제 GPIO 번호와 IO expander 선택은 Board-owned adapter가 소유하고 논리 line만 노출합니다."
  interfaces.topic.gpio.steps: "제품 pin map 작성 → adapter에 line 등록 → configure 후 read/write 순서로 사용합니다."
  interfaces.topic.gpio.limits: "line은 16-bit 식별자이며 interrupt, debounce와 제품 안전 정책은 별도 controller가 소유합니다."
  interfaces.topic.gpio.excluded: "이 page는 보드 pin을 지정하거나 출력을 바꾸지 않으며 실제 GPIO adapter도 조립하지 않습니다."
  interfaces.topic.pwm.title: "PWM 출력"
  interfaces.topic.pwm.summary: "주파수·해상도·duty 계약을 제공하며 실제 출력 장치는 지정하지 않습니다."
  interfaces.topic.pwm.purpose: "밝기, 팬이나 actuator처럼 duty 기반 출력을 공통 정책에서 제어할 때 사용합니다."
  interfaces.topic.pwm.provided: "PwmPort가 channel attach, duty 변경, stop과 detach 결과를 제공합니다."
  interfaces.topic.pwm.connect: "timer와 물리 pin 할당은 platform adapter 내부에서 검증하고 bounded channel로 변환합니다."
  interfaces.topic.pwm.steps: "adapter channel 등록 → PwmConfig 적용 → duty 설정 → stop/detach 순서로 사용합니다."
  interfaces.topic.pwm.limits: "duty 범위는 resolution에 맞춰 adapter가 검증하며 제품별 ramp와 interlock은 별도 정책입니다."
  interfaces.topic.pwm.excluded: "motor, heater와 같은 실제 부하의 pin, 주파수와 안전 제한은 이번 범위에 없습니다."
  interfaces.topic.usb_command.title: "USB CDC 명령"
  interfaces.topic.usb_command.summary: "단일 USB reader와 command dispatcher 사이의 bounded frame 경계입니다."
  interfaces.topic.usb_command.purpose: "PC 도구가 작은 진단·설정 명령을 주고받을 때 stream 소유권을 한곳에 모읍니다."
  interfaces.topic.usb_command.provided: "UsbCommandPort가 최대 512-byte receive/send와 cancel 결과를 제공합니다."
  interfaces.topic.usb_command.connect: "TinyUSB reader는 하나만 두고 완성 frame을 제품 command dispatcher에 전달합니다."
  interfaces.topic.usb_command.steps: "USB adapter 시작 → bounded frame 수신 → protocol 검증 → handler dispatch 순서로 연결합니다."
  interfaces.topic.usb_command.limits: "port는 frame을 보관하지 않습니다. framing, timeout과 권한 검사는 dispatcher 앞에서 제한합니다."
  interfaces.topic.usb_command.excluded: "명령 목록, 인증, serial protocol과 실제 USB endpoint adapter는 구현하지 않았습니다."
  interfaces.topic.storage_files.title: "저장소 파일 접근"
  interfaces.topic.storage_files.summary: "S05가 사용하는 공개 storage 계약과 exclusive lease 흐름입니다."
  interfaces.topic.storage_files.purpose: "HMI가 SD 파일을 읽고 쓸 때 mount generation과 PC 소유권 전환을 안전하게 추적합니다."
  interfaces.topic.storage_files.provided: "modules/storage의 controller와 Board Storage facade가 상태·용량·배타 접근을 제공합니다."
  interfaces.topic.storage_files.connect: "기능 module은 공개 file/lease API만 사용하고 boards/jc1060p470c/internal을 include하지 않습니다."
  interfaces.topic.storage_files.steps: "media 확인 → HMI lease 획득 → bounded stream 처리 → handle/lease 해제 순서로 사용합니다."
  interfaces.topic.storage_files.limits: "SD generation이 바뀌면 기존 handle을 폐기하며 파일 전체를 task stack이나 RAM에 올리지 않습니다."
  interfaces.topic.storage_files.excluded: "S09는 storage 구현을 복제하지 않으며 파일 탐색 UI와 제품 directory 정책도 추가하지 않습니다."
  interfaces.topic.usb_msc.title: "USB 대용량 저장소"
  interfaces.topic.usb_msc.summary: "S05에서 HMI와 PC가 SD를 동시에 소유하지 않도록 전환합니다."
  interfaces.topic.usb_msc.purpose: "PC에서 SD를 이동식 drive로 열되 HMI filesystem 손상을 막아야 할 때 사용합니다."
  interfaces.topic.usb_msc.provided: "SD quiesce, unmount, MSC expose, eject/unplug 감지와 remount 복구가 이미 구현돼 있습니다."
  interfaces.topic.usb_msc.connect: "S05 sd-storage page와 storage access controller가 전역 잠금과 명시적 HMI 복귀를 조정합니다."
  interfaces.topic.usb_msc.steps: "파일 작업 종료 → SD unmount → PC expose → eject/unplug → remount와 generation 갱신 순서입니다."
  interfaces.topic.usb_msc.limits: "PC 소유 중 HMI 파일 I/O는 금지되며 callback drain과 remount 실패 시 잠금을 유지합니다."
  interfaces.topic.usb_msc.excluded: "S09에는 MSC 시작 button이나 새 USB driver가 없으며 실제 동작은 S05에서 확인합니다."
  interfaces.topic.usb_assets.title: "USB 자산 업데이트"
  interfaces.topic.usb_assets.summary: "profile 자산 bundle을 제한된 경로에서 검증·교체하는 Board 내부 기능입니다."
  interfaces.topic.usb_assets.purpose: "firmware를 바꾸지 않고 font, sound와 image bundle을 현장에서 교체할 때 사용합니다."
  interfaces.topic.usb_assets.provided: "asset_usb_updater가 profile root, manifest, size와 hash를 확인한 뒤 generation을 교체합니다."
  interfaces.topic.usb_assets.connect: "Board 시작 경로가 updater를 소유하고 UI는 결과 overlay만 표시합니다. 내부 updater를 직접 호출하지 않습니다."
  interfaces.topic.usb_assets.steps: "bundle 준비 → USB 연결 → manifest/hash 검증 → staging → generation 전환 순서로 처리됩니다."
  interfaces.topic.usb_assets.limits: "허용된 profile root 밖의 경로와 검증되지 않은 파일은 거부하며 MSC나 일반 CDC command와 목적을 섞지 않습니다."
  interfaces.topic.usb_assets.excluded: "일반 파일 복사, firmware partition 기록과 제품 server update는 이 기능이 담당하지 않습니다."
  interfaces.topic.firmware_update.title: "펌웨어 업데이트 기반"
  interfaces.topic.firmware_update.summary: "서명 검증, bounded download, journal과 boot 복구 core만 제공합니다."
  interfaces.topic.firmware_update.purpose: "후속 제품이 안전한 원격 update를 조립할 때 재사용할 검증·복구 정책입니다."
  interfaces.topic.firmware_update.provided: "modules/update가 strict manifest, 4 KiB I/O chunk, A/B CRC journal, generation과 boot 결정을 제공합니다."
  interfaces.topic.firmware_update.connect: "제품 module이 server, crypto, staging storage, firmware writer와 reboot adapter를 port에 연결합니다."
  interfaces.topic.firmware_update.steps: "descriptor 검증 → artifact staging/hash → journal 전이 → 설치 adapter → boot health → accept/rollback 순서입니다."
  interfaces.topic.firmware_update.limits: "manifest는 64 KiB, I/O는 4 KiB로 제한되며 성공은 health confirmation 뒤에만 기록합니다."
  interfaces.topic.firmware_update.excluded: "운영 endpoint, credential, partition write, reboot와 update 실행 UI는 구현하거나 조립하지 않았습니다."
